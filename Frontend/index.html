  <script>
    // 1. Proactively safeguard performance.getEntriesByType for DevTools Live Metrics reportAllChanges
    (function () {
      if (typeof window !== 'undefined' && window.performance) {
        try {
          var origGetEntriesByType = window.performance.getEntriesByType.bind(window.performance);
          window.performance.getEntriesByType = function (type) {
            var list = origGetEntriesByType(type);
            if (type === 'navigation') {
              if (!list || list.length === 0 || !list[0]) {
                return [{
                  name: window.location.href,
                  entryType: 'navigation',
                  startTime: 0,
                  duration: 0,
                  responseStart: 0,
                  loadEventEnd: 0,
                  domContentLoadedEventEnd: 0
                }];
              }
            }
            if (Array.isArray(list)) {
              return list.filter(Boolean).map(function (item) {
                if (item && typeof item.startTime === 'undefined') {
                  try { item.startTime = 0; } catch (e) { }
                }
                return item;
              });
            }
            return list || [];
          };
        } catch (e) { }
      }

      // 2. Suppress harmless DevTools / Chrome Live Metrics web-vitals reportAllChanges bug
      function isIgnorableError(msg, stack) {
        var text = (String(msg || '') + ' ' + String(stack || '')).toLowerCase();
        return (
          text.includes("reading 'starttime'") ||
          text.includes('reportallchanges') ||
          text.includes('starttime') && text.includes('reportall') ||
          text.includes('cannot read properties of undefined (reading \'starttime\')')
        );
      }

      // window.onerror hook
      var prevOnError = window.onerror;
      window.onerror = function (msg, url, lineNo, columnNo, error) {
        if (isIgnorableError(msg, error && error.stack)) {
          return true;
        }
        if (typeof prevOnError === 'function') {
          return prevOnError.apply(this, arguments);
        }
        return false;
      };

      // Capturing phase error event listener
      window.addEventListener(
        'error',
        function (e) {
          var msg = e && e.message ? String(e.message) : '';
          var stack = e && e.error && e.error.stack ? String(e.error.stack) : '';
          if (isIgnorableError(msg, stack)) {
            e.preventDefault();
            if (e.stopImmediatePropagation) e.stopImmediatePropagation();
            return true;
          }
        },
        true
      );

      // Unhandled promise rejections
      window.addEventListener(
        'unhandledrejection',
        function (e) {
          var msg = e && e.reason && e.reason.message ? String(e.reason.message) : '';
          var stack = e && e.reason && e.reason.stack ? String(e.reason.stack) : '';
          if (isIgnorableError(msg, stack)) {
            e.preventDefault();
            if (e.stopImmediatePropagation) e.stopImmediatePropagation();
            return true;
          }
        },
        true
      );

      // Filter out DevTools Live Metrics crash from console.error
      var originalConsoleError = console.error;
      console.error = function () {
        var combined = Array.prototype.slice.call(arguments).map(function (arg) {
          return arg instanceof Error ? (arg.message + ' ' + arg.stack) : String(arg);
        }).join(' ');
        if (isIgnorableError(combined)) {
          return;
        }
        return originalConsoleError.apply(console, arguments);
      };
    })();
  </script>
